version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: clash-bet-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: clash_bot
      MONGO_INITDB_ROOT_PASSWORD: bot_password_123
      MONGO_INITDB_DATABASE: clash_bet
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    driver: local